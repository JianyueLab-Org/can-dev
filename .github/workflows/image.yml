name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只出镜像，不部署。
#
# jyl-tyo 的 kubectl 走的是 Omni 的 OIDC exec 认证（kubectl-oidc_login），那是
# 一条要人来点浏览器的路，CI 里没有办法非交互地走完。所以这里到推镜像为止，
# 上线是手工的一条 `kubectl -n can-dev rollout restart deploy/app` —— 见
# deploy/k8s.yaml 的抬头。
#
# 镜像同时打 sha 和 latest：sha 是回滚时唯一能指名道姓的东西（集群里已有的应用
# 就是按 sha 部署的），latest 只是给第一次 apply 用的方便标签。

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 镜像里再构建一次，但先在这里跑一遍门禁：格式和类型错了就不必进 docker
      # build 了，那一步慢得多。
      - name: 检查
        run: bun run lint

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 写死小写，不用 ${{ github.repository_owner }} —— 那个变量是
          # `JianyueLab-Org`，带大写，而镜像仓库名必须全小写，buildx 会直接
          # 拒绝（invalid tag: repository name must be lowercase）。写死的另一
          # 个好处是它和 deploy/k8s.yaml 里的 image 字段一字不差，改一处漏一处
          # 的可能性小一点。
          tags: |
            ghcr.io/jianyuelab-org/can-dev:${{ github.sha }}
            ghcr.io/jianyuelab-org/can-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
