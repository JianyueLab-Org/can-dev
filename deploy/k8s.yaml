# 开发者中心在 jyl-tyo 上的部署。
#
# 形状照着集群里已有的应用来（见 llm-web）：一个应用一个 namespace，Deployment
# 和 Service 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel
# —— 这个集群没有别的 ingress class，控制器会顺手把 DNS 记录建好。
#
# 密钥不在这个文件里，也不该在。先手工建 Secret：
#
#   kubectl -n can-dev create secret generic can-dev \
#     --from-literal=CAN_CLIENT_SECRET=<注册应用时打印的那一次> \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 32)"
#
# CAN_CLIENT_SECRET 从哪来：开发者中心自己是 can-web 上的一个 OAuth 应用，而且
# 必须**手工**注册 —— 它要的 apps:manage 不在自助注册的名单里（这正是那条规则
# 存在的意义）。在 can-web 那边跑：
#
#   bun run scripts/oauth-client.mjs create can-dev \
#     --name "CAN 开发者中心" \
#     --redirect https://platform.airwaysn.org/auth/callback \
#     --scopes "openid profile apps:manage" \
#     --trusted --website https://platform.airwaysn.org
#
# 回调地址要和这里的 PUBLIC_ORIGIN 拼出来的一字不差 —— can-web 那边是整串精确
# 匹配，差一个斜杠都不行。
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: can-dev
  template:
    metadata:
      labels:
        app: can-dev
    spec:
      containers:
        - name: app
          image: ghcr.io/jianyuelab-org/can-dev:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            - name: CAN_ISSUER
              value: https://airwaysn.org
            - name: PUBLIC_ORIGIN
              value: https://platform.airwaysn.org
            - name: CAN_CLIENT_ID
              value: can-dev
          envFrom:
            - secretRef:
                name: can-dev
          # 首页不碰 can-web，也不需要会话，所以它是一个诚实的探活目标：
          # 200 就代表这个进程真的在服务 HTTP，而不只是端口开着。
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-dev
spec:
  selector:
    app: can-dev
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-dev
  namespace: can-dev
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: platform.airwaysn.org
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
