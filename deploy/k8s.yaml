# 开发者中心在 jyl-tyo 上的部署。
#
# 形状照着集群里已有的应用来（见 llm-web）：一个应用一个 namespace，Deployment
# 和 Service 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel
# —— 这个集群没有别的 ingress class，控制器会顺手把 DNS 记录建好。
#
# 密钥不在这个文件里，也不该在。先手工建 Secret：
#
#   kubectl -n can-dev create secret generic can-dev \
#     --from-literal=CAN_CLIENT_SECRET=<注册应用时打印的那一次> \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 32)"
#
# CAN_CLIENT_SECRET 从哪来：开发者中心自己是网络上的一个 OAuth 应用，而且必须
# **手工**注册 —— 它要的 apps:manage 不在自助注册的名单里（这正是那条规则存在
# 的意义）。在 can-web 那边跑：
#
#   bun run scripts/oauth-client.mjs create can-dev \
#     --name "CAN 开发者中心" \
#     --redirect https://platform.ceruleanavi.net/auth/callback \
#     --scopes "openid profile apps:manage" \
#     --trusted --website https://platform.ceruleanavi.net
#
# 那个脚本写的是 oauthClient 表，而 can-api 读的是同一个库，所以已经注册过的这
# 一行不用重来 —— 换的是主机，不是凭据。
#
# 回调地址要和这里的 PUBLIC_ORIGIN 拼出来的一字不差 —— 服务端是整串精确匹配，
# 差一个斜杠都不行。
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: can-dev
  template:
    metadata:
      labels:
        app: can-dev
    spec:
      containers:
        - name: app
          # 按 sha 钉住，不用 :latest —— 集群里别的应用也是这么做的
          # （llm-web 跑的是 ghcr.io/jianyuelab/llm-web:801aeaa… —— 它的仓库在
          # JianyueLab 组织下，所以前缀不同，这不是笔误）。
          # :latest 没有回滚故事：没有更早的标签可指，而「重启一下」实际上等于
          # 「用最后推上去的那个」。CI 两个标签都推，所以换成 sha 只是改这一行。
          image: ghcr.io/jianyuelab-org/can-dev:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            # 上游是两个地址。can-api 是 issuer，换令牌、userinfo、吊销和
            # /api/v1/dev/clients 都在它那儿；can-web 只剩同意页
            # /oauth/authorize —— 那是渲染给人看的页面，没有跟着数据层搬进 Go。
            # RFC 8414 允许 authorization_endpoint 落在别的源上，can-api 的
            # discovery 文档正是这么写的。
            - name: CAN_API_ORIGIN
              value: https://api.ceruleanavi.net
            - name: CAN_WEB_ORIGIN
              value: https://ceruleanavi.net
            - name: PUBLIC_ORIGIN
              value: https://platform.ceruleanavi.net
            - name: CAN_CLIENT_ID
              value: can-dev
          envFrom:
            - secretRef:
                name: can-dev
          # 首页不碰 can-web，也不需要会话，所以它是一个诚实的探活目标：
          # 200 就代表这个进程真的在服务 HTTP，而不只是端口开着。
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # runAsUser 必须是数字：镜像里写的是 USER node（名字），kubelet 不
          # 解析名字，配上 runAsNonRoot 会直接 CreateContainerConfigError。
          # can-radar 上线时踩过这一脚。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-dev
spec:
  selector:
    app: can-dev
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-dev
  namespace: can-dev
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: platform.ceruleanavi.net
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
